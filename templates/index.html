<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sentiment Analysis</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000012;
        }

        h1 {
            text-align: center;
            color: #243b67;
        }

        p {
            text-align: center;
            color: #666;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            background: #3659a2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #243b67;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: #f3f5fa;
            border-radius: 10px;
        }

        .positive {
            color: #16803c;
        }

        .negative {
            color: #d62828;
        }

        .neutral {
            color: #6b7280;
        }

        .error {
            color: #d62828;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Sentiment Analysis</h1>

        <p>Enter text to analyze its emotional tone.</p>

        <form method="POST">

            <textarea name="text"
                      placeholder="Enter your text here..."
                      required>{{ user_text }}</textarea>

            <button type="submit">
                Analyze Sentiment
            </button>

        </form>

        {% if sentiment %}

        <div class="result">

            <h2>
                Sentiment:
                <span class="{{ sentiment|lower }}">
                    {{ sentiment }}
                </span>
            </h2>

            <p>
                <strong>Polarity Score:</strong>
                {{ "%.2f"|format(polarity) }}
            </p>

            <p>
                <strong>Subjectivity Score:</strong>
                {{ "%.2f"|format(subjectivity) }}
            </p>

        </div>

        {% endif %}

    </div>

</body>
</html>
